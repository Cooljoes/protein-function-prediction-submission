name: Submission validation

on:
  push:
    branches: [main]
    paths:
      - tools/validate_submission.py
      - tests/test_validate_submission.py
      - .github/workflows/submission-validation.yml
  pull_request:
    paths:
      - tools/validate_submission.py
      - tests/test_validate_submission.py
      - .github/workflows/submission-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate submission checker behavior
        run: python -m unittest discover -s tests -p 'test_validate_submission.py' -v
